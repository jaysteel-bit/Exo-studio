function track(el, prop, keys) {

// wordmark pixel resolve: a solid front sweeps left→right; ahead of it 6px square cells, further ahead faint X marks
const word = $('#c-wordmark');
const RESOLVE = [[67, -75], [68, -75], [69, -35], [70, 0], [71, 65], [72, 95], [73, 95], [74, 125], [75, 155], [76, 180], [77, 225], [78, 225], [79, 250], [80, 280], [81, 280], [82, 365], [83, 410]];   // [frame, front px on a 365 px word]
function pixelResolve(f) {
  if (f >= 83) { word.style.maskImage = word.style.webkitMaskImage = 'none'; return; }
  const lerp = () => { for (let i = 1; i < RESOLVE.length; i++) { const [fa, a] = RESOLVE[i - 1], [fb, b] = RESOLVE[i]; if (f <= fb) return a + (b - a) * (f - fa) / (fb - fa); } return 410; };
  const clamp = x => Math.max(0, Math.min(1, x)), w = Math.max(1, word.scrollWidth), h = 130, k = w / 365, front = lerp() * k;
  const reach = (f <= 68 ? 65 : f === 69 ? 285 : 420) * k;
  let ink = '';
  for (let x = 0; x < w + 6; x += 6) {
    const z = (front - x) / k, v = clamp((reach - x) / 120);
    if (v <= 0) continue;
    for (let y = 0; y < h; y += 6) {
      const c = x + 3, d = y + 3;
      if (z > 15) ink += `<rect x="${x}" y="${y}" width="6.1" height="6.1" fill="white"/>`;
      else if (z > -35) { const s = 4.5 + clamp((z + 35) / 50) * 1.6; ink += `<rect x="${c - s / 2}" y="${d - s / 2}" width="${s}" height="${s}" fill="white" opacity="${0.6 + 0.4 * v}"/>`; }
      else { const s = 0.7 + 0.9 * v; ink += `<path d="M${c - s},${d - s}L${c + s},${d + s}M${c - s},${d + s}L${c + s},${d - s}" stroke="white" stroke-width="${0.45 + 0.45 * v}" opacity="${0.1 + 0.55 * v}"/>`; }
    }
  }
  const url = `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${ink}</svg>`)}")`;
  word.style.maskImage = word.style.webkitMaskImage = url;
  word.style.maskSize = word.style.webkitMaskSize = `${w}px ${h}px`;
}

  if (f >= 67) pixelResolve(f);
